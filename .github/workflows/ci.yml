name: CI

# Roda lint, typecheck e as três suítes de testes (Vitest + Playwright no
# Next.js, pytest no Django) em todo PR e push na main — antes disso, nada
# impedia um PR quebrado de ir pra main, que já tem deploy automático de
# produção nos dois projetos Vercel.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  nextjs:
    name: Next.js — lint, typecheck e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # autenticacao_test é a mesma database usada localmente pela suíte
      # (ver tests/globalSetup.ts) — criada abaixo antes de rodar as
      # migrations.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autenticacao_test
      # Segredos gerados só para este job, descartados ao final — nunca são
      # os valores reais de produção (esses ficam nas env vars da Vercel).
      JWT_REFRESH_SECRET: ci-refresh-secret-nao-usar-em-producao-000000
      JWT_MFA_SECRET: ci-mfa-secret-nao-usar-em-producao-0000000000
      JWT_VERIFICACAO_EMAIL_SECRET: ci-verificacao-email-secret-000000000
      JWT_REDEFINICAO_SENHA_SECRET: ci-redefinicao-senha-secret-00000000
      JWT_ALTERACAO_EMAIL_SECRET: ci-alteracao-email-secret-0000000000
      JWT_PASSKEY_SECRET: ci-passkey-secret-00000000000000000000
      JWT_CONVITE_ORGANIZACAO_SECRET: ci-convite-organizacao-secret-000000
      PASSKEY_RP_ID: localhost
      PASSKEY_RP_NAME: Auth Gateway CI
      PASSKEY_ORIGIN: http://localhost:3100
      CRON_SECRET: ci-cron-secret-000000000000000000000000
      DJANGO_SERVICE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar database de teste
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE autenticacao_test;"
        env:
          PGPASSWORD: postgres

      # Chave RS256 (par público/privado do access token) e MFA_ENCRYPTION_KEY
      # (32 bytes exatos, ver src/lib/cripto.ts) não dá pra fixar como
      # literal no YAML — geradas aqui e exportadas sem aspas para
      # $GITHUB_ENV (aspas literais quebrariam o base64).
      - name: Gerar segredos de chave (RS256 + AES-256) para o job
        run: |
          node -e '
            const { generateKeyPairSync, randomBytes } = require("node:crypto");
            const { publicKey, privateKey } = generateKeyPairSync("rsa", {
              modulusLength: 2048,
              publicKeyEncoding: { type: "spki", format: "pem" },
              privateKeyEncoding: { type: "pkcs8", format: "pem" },
            });
            console.log("JWT_ACCESS_PRIVATE_KEY_B64=" + Buffer.from(privateKey).toString("base64"));
            console.log("JWT_ACCESS_PUBLIC_KEY_B64=" + Buffer.from(publicKey).toString("base64"));
            console.log("MFA_ENCRYPTION_KEY=" + randomBytes(32).toString("base64"));
          ' >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      - name: Upload das traces do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # reporter é "list" (playwright.config.ts) — não gera playwright-report/
          # HTML. trace: "retain-on-failure" grava em test-results/ mesmo assim,
          # que é o que dá pra abrir com `npx playwright show-trace` depois.
          name: playwright-traces
          path: test-results/
          retention-days: 7

  django:
    name: Django — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    env:
      # SQLite local basta aqui: comum/autenticacao.py só valida o JWT (não
      # tem model de usuário próprio), e settings.py já cai pra sqlite
      # quando DATABASE_URL não está definida — sem precisar subir Postgres
      # neste job.
      DJANGO_SECRET_KEY: ci-django-secret-key-nao-usar-em-producao
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # comum/autenticacao.py só precisa da chave PÚBLICA (a privada nunca
      # circula por aqui) — gerada isolada, sem relação com o par usado no
      # job "nextjs".
      - name: Gerar chave pública RS256 para o job
        run: |
          python -c "
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          import base64, os

          chave = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          publica_pem = chave.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('JWT_ACCESS_PUBLIC_KEY_B64=' + base64.b64encode(publica_pem).decode() + '\n')
          "

      - name: Testes
        run: pytest
