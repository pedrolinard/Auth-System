name: Monitor de saúde (produção)

# Consulta os endpoints de saúde de produção a cada 15 minutos. Se algum não
# responder 200 (banco fora, chave de assinatura ilegível, migration pendente
# no Django), o job falha e o GitHub avisa por e-mail quem configurou o
# workflow. Antes não havia monitor nenhum: o Rollbar só avisa de erro, não de
# queda, e a tela de projetos ficou dias em 500 sem ninguém saber.
#
# Limitações do agendamento do GitHub, pra não confiar mais do que ele dá:
# atrasos de alguns minutos em horário de pico, e agendamentos de repositório
# público são pausados depois de 60 dias sem atividade no repositório. Um
# monitor externo dedicado (docs/operacao.md) continua sendo o recomendado
# pra cliente pagante.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  saude:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Next.js — /api/saude
        run: curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-delay 10 https://auth-gateway-kappa.vercel.app/api/saude
      - name: Django — /api/dominio/saude
        if: always()
        run: curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-delay 10 https://auth-gateway-kappa.vercel.app/api/dominio/saude
      # Carona no mesmo agendamento: anda a fila de retentativas de webhooks
      # (a Vercel Hobby só roda o job diário). Sem o segredo CRON_SECRET no
      # repositório, o passo só avisa e não falha o monitor.
      - name: Fila de webhooks
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::Segredo CRON_SECRET ausente; fila de webhooks fica só com o job diário."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://auth-gateway-kappa.vercel.app/api/cron/webhooks
